name: General improvement
description: Suggest an improvement to the Word Explainer website or tooling
title: "[IMPROVEMENT] <short description>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please fill in the details below.

  - type: checkboxes
    id: improvement_type
    attributes:
      label: What would you like to improve?
      options:
        - label: Website styling or layout
        - label: Website functionality
        - label: Documentation
        - label: Tooling (e.g. [`create.py`](https://github.com/softwaresaved/word-explainer/blob/main/dev-tools/create.py)
        - label: Other (please describe below)

  - type: textarea
    id: current_issue
    attributes:
      label: What is the current issue or limitation?
      description: What is wrong or missing?
    validations:
      required: true

  - type: textarea
    id: suggested_improvement
    attributes:
      label: What improvement would you like to see?
      description: Describe the improvement you would like to see.
    validations:
      required: true

  - type: textarea
    id: benefit
    attributes:
      label: Why would this be beneficial?
      description: Why would this improvement be useful to contributors or users?
    validations:
      required: true

  - type: textarea
    id: anything_else
    attributes:
      label: Anything else?
      description: Any additional context or notes.
