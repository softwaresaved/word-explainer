name: Suggest a new term or role
description: Suggest a new term or role to be added to the Word Explainer
title: "[NEW] <term or role name>"
labels: ["new entry"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new entry! Please fill in the details below.

        - Terms (i.e. words we use) are concepts, tools, or ideas (e.g. version control, open source)
        - Roles (i.e. kinds of people) are job titles or functions people hold (e.g. Research Software Engineer, Data Scientist)

  - type: dropdown
    id: entry_type
    attributes:
      label: What would you like to add?
      options:
        - A new term
        - A new role
    validations:
      required: true

  - type: input
    id: entry_name
    attributes:
      label: Name of the term or role
      placeholder: e.g. version control, Research Software Engineer
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why should this be added?
      description: Why is this term or role relevant to the Word Explainer?
    validations:
      required: true

  - type: dropdown
    id: has_definition
    attributes:
      label: Do you have a suggested definition?
      description: |
        Definitions should only use the 1000 most common words in English.
        You can check this at [XKCD simple writer](https://xkcd.com/simplewriter/).
      options:
        - "Yes — I have a suggested definition (please provide below)"
        - "No — I would like the community to suggest one"
    validations:
      required: true

  - type: textarea
    id: up_goer_five_name
    attributes:
      label: Up-Goer Five name
      description: |
        A short plain-language version of the name using only the 1000 most
        common words in English. This appears as the subtitle on the entry page.
        Check your words using the [XKCD Simple Writer](https://xkcd.com/simplewriter/).
      placeholder: e.g. "Person who helps make computer things work better"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ### Term definitions
        
        The following fields apply to **terms only**. If you are suggesting a
        role, you can skip to the description below.
        
        A term can have a noun definition (what it **is**), a verb definition
        (what it **does**), or both — but at least one must be provided.

  - type: textarea
    id: noun_definition
    attributes:
      label: Noun definition (what it is)
      description: |
        A short plain-language definition of the term as a noun.
        Only use the 1000 most common words in English.
        Check your definition at [XKCD Simple Writer](https://xkcd.com/simplewriter/).
      placeholder: |
        Leave blank if this term does not have a noun definition, or if you are suggesting a role.

  - type: textarea
    id: noun_description
    attributes:
      label: Noun description
      description: |
        A longer description of the term as a noun.
        Only use the 1000 most common words in English.
      placeholder: |
        Leave blank if you did not provide a noun definition above.

  - type: textarea
    id: verb_definition
    attributes:
      label: Verb definition (what it does)
      description: |
        A short plain-language definition of the term as a verb.
        Only use the 1000 most common words in English.
        Check your definition at [XKCD Simple Writer](https://xkcd.com/simplewriter/).
      placeholder: |
        Leave blank if this term does not have a verb definition, or if you are suggesting a role.

  - type: textarea
    id: verb_description
    attributes:
      label: Verb description
      description: |
        A longer description of the term as a verb.
        Only use the 1000 most common words in English.
      placeholder: |
        Leave blank if you did not provide a verb definition above.

  - type: markdown
    attributes:
      value: |
        ---
        ### Role description

        The following field applies to **roles only**. If you are suggesting a
        term, you can skip this.

  - type: textarea
    id: role_description
    attributes:
      label: Role description
      description: |
        A longer description explaining the role.
        Only use the 1000 most common words in English.
        Check your description at [XKCD Simple Writer](https://xkcd.com/simplewriter/).
      placeholder: |
        Leave blank if you are suggesting a term.

  - type: checkboxes
    id: up_goer_five_check
    attributes:
      label: Up-Goer Five check
      options:
        - label: I have checked my definition using the [XKCD Simple Writer](https://xkcd.com/simplewriter/)
          required: true

  - type: textarea
    id: anything_else
    attributes:
      label: Anything else?
      description: Any additional context or notes.
