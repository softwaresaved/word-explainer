name: Bug report
description: Report a bug or broken functionality on the Word Explainer website
title: "[BUG] <short description>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in the details below to help us fix it.

  - type: textarea
    id: bug_description
    attributes:
      label: What is the bug?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: How can it be reproduced?
      description: Steps to reproduce the bug.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected_behaviour
    attributes:
      label: What did you expect to happen?
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, please include screenshots to help explain the bug.

  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: e.g. Chrome, Firefox, Safari

  - type: input
    id: operating_system
    attributes:
      label: Operating system
      placeholder: e.g. Windows, macOS, Linux

  - type: textarea
    id: anything_else
    attributes:
      label: Anything else?
      description: Any additional context or notes.
